version: "3.8"

services:
  feedygram:
    build: .
    container_name: feedygram
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-300}
      - FEED_PROVIDER=local
      # Interroga direttamente il container XRSS sulla rete interna di Docker
      - TWITTER_RSS_BRIDGE=http://xrss:8000/{username}
    volumes:
      # Persistenza del database SQLite
      - feedygram_data:/app/src/database/data
    depends_on:
      - xrss
    networks:
      - feedygram_net

  xrss:
    image: ghcr.io/thytu/xrss:latest
    container_name: xrss
    restart: unless-stopped
    # Non è necessario esporre la porta all'esterno se usato solo da Feedygram
    # ports:
    #   - "8000:8000"
    networks:
      - feedygram_net

volumes:
  feedygram_data:
    name: feedygram_data

networks:
  feedygram_net:
    name: feedygram_net
