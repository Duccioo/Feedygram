version: "3.8"

services:
  feedygram:
    build: .
    container_name: feedygram
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-300}
      - FEED_PROVIDER=local
    volumes:
      # Persistenza del database SQLite
      - feedygram_data:/app/src/database/data
    networks:
      - feedygram_net

  # Container opzionale per auto-update delle immagini
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
    networks:
      - feedygram_net

volumes:
  feedygram_data:
    name: feedygram_data

networks:
  feedygram_net:
    name: feedygram_net
